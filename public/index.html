
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline CI/CD</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f4f0ff;
      color: #292344;
    }

    main {
      width: min(90%, 460px);
      padding: 32px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 10px 35px #29234418;
      text-align: center;
    }

    h1 {
      color: #7254c8;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #d8d1ed;
    }

    button {
      border: 0;
      background: #7254c8;
      color: white;
      cursor: pointer;
    }

    #resultado {
      min-height: 24px;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>Olá, seja bem-vindo!</h1>
    <p>Meu primeiro projeto com CI/CD</p>

    <form id="formulario">
      <input id="nome" type="text" placeholder="Digite seu nome">
      <button type="submit">Gerar saudação</button>
    </form>

    <p id="resultado" aria-live="polite"></p>
  </main>

  <script>
    const formulario = document.querySelector("#formulario");
    const nome = document.querySelector("#nome");
    const resultado = document.querySelector("#resultado");

    formulario.addEventListener("submit", async (event) => {
      event.preventDefault();
      resultado.textContent = "Carregando...";

      try {
        const parametro = encodeURIComponent(nome.value.trim());
        const resposta = await fetch(`/api/hello?name=${parametro}`);

        if (!resposta.ok) {
          throw new Error("Não foi possível gerar a saudação.");
        }

        const dados = await resposta.json();
        resultado.textContent = dados.greeting;
      } catch {
        resultado.textContent = "Erro ao conectar com a API.";
      }
    });
  </script>
</body>
</html>
